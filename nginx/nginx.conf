# Zenvyra Nginx Configuration
# Production reverse proxy for Zenvyra application stack

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

http {
    # Basic settings
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    client_max_body_size 10M;

    # MIME types
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_request_id"';
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # SSL settings (configure when certificates are available)
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=scanner:10m rate=10r/s;

    # Upstream backend and frontend
    upstream backend {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 64;
    }

    upstream frontend {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # HTTP server - redirect to HTTPS
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # HTTPS server
    server {
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        server_name _;

        # SSL certificate paths (mount from host or certbot)
        # ssl_certificate /etc/nginx/ssl/cert.pem;
        # ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Frontend routes
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 30s;
            proxy_connect_timeout 10s;

            # Browser caching for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 30d;
                add_header Cache-Control "public, immutable";
                proxy_pass http://frontend;
            }
        }

        # Backend API
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            proxy_pass http://backend/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-Id $request_id;
            proxy_read_timeout 60s;
            proxy_connect_timeout 10s;

            # WebSocket support
            location /api/ws {
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection "upgrade";
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
                proxy_pass http://backend/api/ws;
            }
        }

        # Health check endpoint (no rate limit)
        location /api/health {
            access_log off;
            proxy_pass http://backend/api/health;
            proxy_read_timeout 5s;
        }

        # Badge/verification (public)
        location /badge/ {
            limit_req zone=scanner burst=30 nodelay;
            proxy_pass http://backend/api/badge/;
            proxy_read_timeout 15s;
        }

        location /verify/ {
            limit_req zone=scanner burst=30 nodelay;
            proxy_pass http://backend/api/verify/;
            proxy_read_timeout 15s;
        }

        # Error pages
        error_page 502 /502.html;
        error_page 503 /503.html;
        location = /502.html {
            internal;
            root /usr/share/nginx/html;
        }
        location = /503.html {
            internal;
            root /usr/share/nginx/html;
        }
    }
}
