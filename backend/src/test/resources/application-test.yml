spring:
  config:
    activate:
      on-profile: test

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: mock-google-client-id
            client-secret: mock-google-client-secret

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://127.0.0.1:27017/Zenvyra_test}
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}

app:
  jwt:
    secret: ${JWT_SECRET:test-32-byte-secret-for-ci-only-ok-000000}
  security:
    hsts-enabled: false
  auth:
    cookies:
      secure: false
  audit:
    consent-salt: test-consent-salt-for-ci

openai:
  api-key: ${OPENAI_API_KEY:sk-test-placeholder}
