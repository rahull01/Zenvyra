spring:
  config:
    activate:
      on-profile: staging

server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain

  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: false
    redis:
      url: ${REDIS_URL}

app:
  url: ${APP_URL}
  security:
    hsts-enabled: true
  auth:
    cookies:
      secure: true
  backup:
    enabled: ${APP_BACKUP_ENABLED:false}
    provider: ${APP_BACKUP_PROVIDER:}

frontend:
  url: ${FRONTEND_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: INFO
    com.zenvyra: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

rate-limit:
  in-memory-fallback-enabled: true
