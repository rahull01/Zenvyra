spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/complianceai}

logging:
  level:
    root: DEBUG
    com.complianceai: TRACE
    org.springframework.web: DEBUG

# Development settings
app:
  dev-mode: true
  mock-payments: true
  jwt:
    # Local default only when JWT_SECRET is unset — override in .env for shared environments
    secret: ${JWT_SECRET:dev-only-change-this-32-byte-secret!!}

# CORS — wildcard is incompatible with credentials; use explicit dev origins
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
