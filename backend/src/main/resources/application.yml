server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

spring:
  application:
    name: zenvyra

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}
            scope:
              - openid
              - email
              - profile
            redirect-uri: "{baseUrl}/api/login/oauth2/code/{registrationId}"
            client-settings:
              require-proof-key: true

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/Zenvyra}
      auto-index-creation: true
    redis:
      url: ${REDIS_URL:redis://localhost:6379}

  mail:
    host: ${EMAIL_HOST:smtp.resend.com}
    port: ${EMAIL_PORT:587}
    username: ${EMAIL_USER:${RESEND_API_KEY:}}
    password: ${EMAIL_PASS:${RESEND_API_KEY:}}
    protocol: smtp
    tls: true
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

# JWT Configuration (JWT_SECRET must be set — min 32 characters)
app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:86400000}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
    password-reset-expiration: ${JWT_PASSWORD_RESET_EXPIRATION:3600000}
    email-verification-expiration: ${JWT_EMAIL_VERIFICATION_EXPIRATION:86400000}
  url: ${APP_URL:http://localhost:3000}
  ops-alert-email: ${APP_OPS_ALERT_EMAIL:}
  security:
    hsts-enabled: ${APP_SECURITY_HSTS_ENABLED:false}
  auth:
    cookies:
      secure: ${APP_AUTH_COOKIES_SECURE:false}
  backup:
    enabled: ${APP_BACKUP_ENABLED:false}
    provider: ${APP_BACKUP_PROVIDER:}
    last-restore-drill-at: ${APP_BACKUP_LAST_RESTORE_DRILL_AT:}

# OpenAI Configuration
openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-4-turbo-preview
  max-tokens: 4000
  temperature: 0.7

# Dodo Payments Configuration
dodo:
  api-key: ${DODO_API_KEY:${PAYMENT_API_KEY:}}
  webhook-secret: ${DODO_WEBHOOK_SECRET:${WEBHOOK_SECRET:}}
  base-url: ${DODO_BASE_URL:https://api.dodopayments.com}
  products:
    growth: ${DODO_GROWTH_PRODUCT_ID:}
    pro: ${DODO_PRO_PRODUCT_ID:}
    agency: ${DODO_AGENCY_PRODUCT_ID:${DODO_ENTERPRISE_PRODUCT_ID:}}
    setup-package: ${DODO_SETUP_PACKAGE_PRODUCT_ID:}

# Frontend URL (CORS)
frontend:
  url: ${FRONTEND_URL:http://localhost:3000}
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Logging
logging:
  level:
    root: INFO
    com.zenvyra: INFO
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Sentry error monitoring (optional — Sentry only reports when DSN is set)
sentry:
  dsn: ${SENTRY_DSN:}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.1}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:unknown}}

# App Properties
app-meta:
  name: Zenvyra
  version: 1.0.0
  description: AI-Powered Compliance Automation
  support-email: support@zenvyra.com

# Rate limiting defaults (overridable per profile; matches RateLimitProperties).
# Keys align with com.zenvyra.config.RateLimitProperties fields.
rate-limit:
  public-scanner-hourly: 3
  public-scanner-hourly-window-seconds: 3600
  public-scanner-daily: 5
  public-scanner-daily-window-seconds: 86400
  badge-per-minute: 120
  badge-window-seconds: 60
  public-read-per-minute: 300
  public-read-window-seconds: 60
  auth-per-window: 10
  auth-window-seconds: 300
  public-write-per-minute: 60
  public-write-window-seconds: 60
  payment-webhook-per-minute: 120
  payment-webhook-window-seconds: 60
  full-scan-free: 5
  full-scan-starter: 20
  full-scan-pro: 100
  full-scan-enterprise: 1000
  full-scan-window-seconds: 86400
  full-scan-org-multiplier: 5
  full-scan-org-min: 50
  public-write-max-bytes: 65536
  in-memory-fallback-enabled: false
