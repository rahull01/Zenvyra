spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGODB_URI}
    redis:
      url: ${REDIS_URL}

app:
  url: ${APP_URL}
  ops-alert-email: ${APP_OPS_ALERT_EMAIL:}
  security:
    hsts-enabled: true
  auth:
    cookies:
      secure: true
  backup:
    enabled: ${APP_BACKUP_ENABLED:false}
    provider: ${APP_BACKUP_PROVIDER:}
    last-restore-drill-at: ${APP_BACKUP_LAST_RESTORE_DRILL_AT:}

frontend:
  url: ${FRONTEND_URL}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

logging:
  level:
    root: WARN
    com.zenvyra: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Production settings
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Security headers
security:
  headers:
    hsts: true
    frame-options: DENY
    xss-protection: true
    content-security-policy: "default-src 'self'"

# Rate limiting
rate-limit:
  enabled: true
  requests-per-minute: 100
