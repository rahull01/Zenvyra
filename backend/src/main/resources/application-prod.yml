spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGODB_URI}

logging:
  level:
    root: WARN
    com.complianceai: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# Production settings
server:
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain,application/javascript,text/css

# Security headers
security:
  headers:
    hsts: true
    frame-options: DENY
    xss-protection: true
    content-security-policy: "default-src 'self'"

# Rate limiting
rate-limit:
  enabled: true
  requests-per-minute: 100
