services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: Zenvyra-backend-staging
    ports:
      - "8081:8080"
    env_file:
      - ./.env.staging
    environment:
      - SPRING_PROFILES_ACTIVE=staging
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - Zenvyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: Zenvyra-frontend-staging
    ports:
      - "3001:3000"
    env_file:
      - ./.env.staging
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8081/api}
      - API_BASE_URL=http://backend:8080/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - backend
    networks:
      - Zenvyra-network
    restart: unless-stopped

  mongo:
    image: mongo:7.0
    container_name: Zenvyra-mongo-staging
    ports:
      - "27018:27017"
    environment:
      - MONGO_INITDB_DATABASE=Zenvyra
    volumes:
      - mongo-data-staging:/data/db
      - ./db_init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - Zenvyra-network
    restart: unless-stopped
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/Zenvyra --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: Zenvyra-redis-staging
    ports:
      - "6380:6379"
    volumes:
      - redis-data-staging:/data
    networks:
      - Zenvyra-network
    restart: unless-stopped
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data-staging:
    driver: local
  redis-data-staging:
    driver: local

networks:
  Zenvyra-network:
    driver: bridge
